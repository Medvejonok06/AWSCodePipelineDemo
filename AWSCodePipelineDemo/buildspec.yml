version: 0.2
phases:
  install:
    runtime-versions:
      dotnet: 8.0
  build:
    commands:
      - dotnet publish -c Release -o ./app AWSCodePipelineDemo/AWSCodePipelineDemo.csproj
      - echo 'web: dotnet AWSCodePipelineDemo.dll' > ./app/Procfile
artifacts:
  files:
    - '**/*'
  base-directory: app
